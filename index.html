<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muro · reconstruye tu disciplina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#17233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E4E6E8; --surface:#F4F5F6; --ink:#17233A; --muted:#5B6678; --line:#C3C8CF;
  --amber:#F2B705; --amber-ink:#17233A; --miss:#B8442F; --partial:#9AA6B8; --gap:#D5D9DE; --done:#2F8F5B;
  --display:'Archivo','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Work Sans','Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --surface:#18233A; --ink:#E8ECF2; --muted:#93A0B5; --line:#2A3853;
    --partial:#56637B; --gap:#1F2C46; --miss:#E0664F; --done:#4CB582;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#18233A; --ink:#E8ECF2; --muted:#93A0B5; --line:#2A3853;
  --partial:#56637B; --gap:#1F2C46; --miss:#E0664F; --done:#4CB582;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:3px solid var(--ink)}
.rank .lvl{font-weight:600;color:var(--muted);font-size:.95rem}
.rank h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,8vw,3.8rem);line-height:.95;letter-spacing:-.02em}
.xp{flex:1 1 260px;max-width:420px}
.bar{height:16px;background:var(--gap);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--amber);transition:width .5s}
.xp p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}

h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
h3{margin:22px 0 8px;font-size:1rem;font-weight:600;color:var(--muted)}
.sub{margin:0 0 14px;color:var(--muted)}
.view{margin-top:22px}
.back{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:600}

/* Hoy */
.daynav{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.daynav>div{flex:1}
.ic{flex:none;width:44px;height:44px;border-radius:6px;border:2px solid var(--ink);background:transparent;font-size:1.4rem;font-weight:800;line-height:1}
.phrase{margin:0 0 16px;padding:0 0 0 14px;border-left:4px solid var(--amber);font-size:1.05rem;font-weight:500}
.banner{padding:12px 14px;border-left:6px solid var(--amber);background:var(--surface);margin:0 0 6px;font-weight:500}
.banner.ok{border-left-color:var(--done)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;min-height:56px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
button.habit:hover{border-color:var(--ink)}
.box{flex:none;width:34px;height:20px;border-radius:3px;border:2px solid var(--ink);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:transparent;transition:background .2s}
.habit.on{border-color:var(--done)}
.habit.on .box{background:var(--amber);color:var(--amber-ink)}
.habit.on .nm b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.habit.bad{border-color:var(--miss)}
.habit.bad .box{background:var(--miss);border-color:var(--miss);color:#fff}
.nm{flex:1;min-width:0;font-weight:500;display:grid;gap:2px}
.nm small{color:var(--muted);font-weight:400;font-size:.85rem}
.pts{font-weight:600;color:var(--muted);font-size:.9rem;white-space:nowrap}
.mini{height:6px;background:var(--gap);border-radius:2px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--amber);transition:width .3s}
.step{display:flex;gap:6px}
.step button,.chip{min-width:44px;height:44px;border:2px solid var(--ink);border-radius:6px;background:transparent;font-weight:800;font-size:1.2rem}
.chip{padding:0 12px;font-size:.9rem;font-weight:600}
.chip[aria-pressed="true"].yes{background:var(--done);border-color:var(--done);color:#fff}
.chip[aria-pressed="true"].no{background:var(--miss);border-color:var(--miss);color:#fff}
.chip.no{border-color:var(--miss);color:var(--miss)}
.chip.no[aria-pressed="true"]{color:#fff}
.chips{display:flex;gap:6px}
.empty{padding:18px;border:2px dashed var(--line);border-radius:6px;color:var(--muted)}
textarea{width:100%;min-height:84px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);resize:vertical}
label.l{display:block;margin:22px 0 6px;font-weight:600}
.linkrow{margin-top:18px;color:var(--muted)}

/* Progreso */
.stats{display:flex;flex-wrap:wrap;margin:0 0 6px;padding:0;list-style:none;border-bottom:1px solid var(--line)}
.stats li{flex:1 1 110px;padding:12px 12px 12px 0}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1}
.stats span{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:36px;margin-top:22px}
@media (min-width:860px){.grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px}}
.wall{display:grid;gap:4px;margin-top:6px}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:93.333%}
.row:nth-child(even){margin-left:6.667%}
.brick{position:relative;aspect-ratio:2/1;min-height:26px;border:0;padding:0;border-radius:3px;background:var(--gap);color:var(--muted);font-size:.72rem;font-weight:600;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.brick::before{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--fill,var(--partial));transition:width .4s}
.brick span{position:relative}
.brick.ok{--fill:var(--amber);color:var(--amber-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brick.miss{box-shadow:inset 0 0 0 2px var(--miss)}
.brick.miss.has{color:var(--ink)}
.brick.future,.brick.out{opacity:.4;cursor:default}
.brick.today{outline:3px solid var(--amber);outline-offset:1px}
.brick.rest{background:repeating-linear-gradient(135deg,var(--gap) 0 4px,var(--line) 4px 8px);color:var(--ink)}
.brick.free{background:var(--gap);opacity:.6}
.brick.shield{background:var(--ink);color:var(--bg);box-shadow:none}
.brick.sel,.brick.ok.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b{width:100%;border-radius:3px 3px 0 0;background:var(--amber);min-height:3px;transition:height .4s}
.bars .b.best{background:var(--done)}
.bars .b.worst{background:var(--miss)}
.bars .b.cur{outline:2px solid var(--ink);outline-offset:1px}
.bars small{margin-top:6px;color:var(--muted);font-size:.78rem;white-space:nowrap}
.bars .v{font-size:.75rem;color:var(--muted);margin-bottom:3px}
.hb{margin:12px 0}
.hb .t{display:flex;justify-content:space-between;gap:10px;font-weight:500;margin-bottom:4px}
.hb .t span:last-child{font-weight:600;color:var(--muted)}
.track{height:10px;background:var(--gap);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber)}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}

/* Logros */
.ms{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ms li{padding-bottom:14px;border-bottom:1px solid var(--line)}
.ms .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.ms .h span:last-child{color:var(--muted);white-space:nowrap}
.ms .s{margin-top:4px;font-size:.88rem;color:var(--muted)}
.ms li.done .h span:first-child{color:var(--done)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{padding:12px;border:1px solid var(--line);border-radius:6px;opacity:.5}
.ach.on{opacity:1;border-color:var(--amber);background:var(--surface)}
.ach .ico{display:block;width:30px;height:15px;border-radius:2px;background:var(--gap);margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--line)}
.ach.on .ico{background:var(--amber);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ach b{display:block;font-weight:600;line-height:1.25}
.ach small{display:block;color:var(--muted);margin-top:2px;font-size:.82rem}

/* Resumen */
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{padding:8px 18px;background:transparent;border:0;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pernav{display:flex;align-items:center;gap:10px;margin:14px 0}
.pernav b{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:1.15rem;text-transform:capitalize}
.headline{font-size:1.2rem;font-weight:500;margin:0 0 6px}
.nl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.nl li{padding:10px 12px;border-left:4px solid var(--amber);background:var(--surface)}
.nl time{display:block;color:var(--muted);font-size:.85rem;text-transform:capitalize}

/* Ajustes */
.sec{padding:22px 0;border-bottom:1px solid var(--line)}
.sec:first-child{padding-top:0}
.sec h3{margin:0 0 10px;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.15rem}
.field{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=text],input[type=number]{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.btn{padding:10px 16px;border-radius:6px;border:2px solid var(--ink);background:transparent;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--miss);color:var(--miss)}
.btn.armed{background:var(--miss);color:#fff}
.hl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.hl li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hl li div{flex:1;min-width:0}
.hl small{display:block;color:var(--muted)}
.add{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.add label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
.add .full{grid-column:1/-1}
.add input,.add select{background:var(--bg)}
@media (max-width:520px){.add{grid-template-columns:1fr 1fr}}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.steps li{margin:4px 0}

.hl li{flex-wrap:wrap}
.hl .hinfo{flex:1 1 200px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:6px 10px;font-size:.9rem;border-width:1px;min-height:36px}
.days{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.days legend{padding:0;margin-bottom:6px;font-size:.85rem;color:var(--muted);font-weight:500}
.days label{display:block;position:relative}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--ink);border-radius:6px;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer}
.days input:checked+span{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.days input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.hl li.editing{display:block;padding:0;border:0;background:none}
.restbtn{margin-top:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:14px 2px 12px;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;font-weight:600;font-size:.8rem;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--amber)}

#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:6px;font-weight:600;transition:all .3s;max-width:90vw;text-align:center;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
#undo{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;visibility:hidden;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:6px;font-weight:600;transition:all .3s;max-width:92vw;z-index:21}
#undo.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
#undo button{flex:none;background:var(--amber);color:var(--amber-ink);border:0;border-radius:4px;padding:10px 16px;min-height:44px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="undo" role="status" aria-live="polite"></div>

<script>
/* ============ Utilidades ============ */
const KEY='muro-v1', BONUS=20;
const CATS=['Estudio','Ejercicio','Rutina','Otro'];
const RANKS=['Escombros','Cimientos','Cimientos','Muros','Muros','Estructura','Estructura','Torre','Torre','Fortaleza'];
const WD=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'], WDS=['L','M','X','J','V','S','D'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const weekStart=s=>addDays(s,-((parse(s).getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'h'+Math.random().toString(36).slice(2,9);
const num=n=>String(Math.round(n*100)/100).replace('.',',');
const fmtShort=d=>parse(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const fmtLong=d=>parse(d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const pc=x=>Math.round(x*100);

/* ============ Estado ============ */
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){mem=S;SV++;if(UNDO&&UNDO.v!==SV)hideUndo();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ALLD=[0,1,2,3,4,5,6];
function fresh(){return migrate({start:today(),threshold:0.8,log:{},habits:[
  {id:uid(),name:'Estudiar 1 hora',cat:'Estudio',xp:15,type:'check'},
  {id:uid(),name:'Hacer ejercicio',cat:'Ejercicio',xp:15,type:'check'},
  {id:uid(),name:'Beber agua',cat:'Rutina',xp:5,type:'count',target:2,unit:'L',step:0.25},
  {id:uid(),name:'Leer 10 minutos',cat:'Rutina',xp:10,type:'check'},
  {id:uid(),name:'Acostarme a mi hora',cat:'Rutina',xp:10,type:'check'},
  {id:uid(),name:'Redes sociales en horas de estudio',cat:'Estudio',xp:10,type:'avoid'}
]})}
function migrate(o){
  if(!o)return null;
  o.ver=3;o.threshold=o.threshold||0.8;o.start=o.start||today();o.log=o.log||{};
  o.claimed=o.claimed||{};o.unlocked=o.unlocked||{};o.theme=o.theme||'auto';o.maxRest=o.maxRest||2;
  o.habits=(o.habits||[]).map(h=>{
    const x=Object.assign({type:'check',target:1,unit:'',step:1,days:ALLD.slice(),since:'',until:null},h);
    if(!Array.isArray(x.days)||!x.days.length)x.days=ALLD.slice();
    return x;
  });
  Object.values(o.log).forEach(r=>{r.done=r.done||{};r.vals=r.vals||{};r.slip=r.slip||{};r.note=r.note||'';r.rest=!!r.rest});
  return o;
}
const stored=load(), oldVer=stored&&stored.ver;
let S=migrate(stored)||fresh();
let UNDO=null, UT=null, SV=0;
let tab='hoy', sel=today(), sumMode='sem', sumOff=0, armed=false, armTimer=null, delArm=null, delTimer=null, editId=null, focusKey=null, IC={}, TL=null;
const habit=id=>S.habits.find(h=>h.id===id);
const hasCat=c=>S.habits.some(h=>h.cat===c&&!h.until), hasAvoid=()=>S.habits.some(h=>h.type==='avoid'&&!h.until);
const wdx=d=>(parse(d).getDay()+6)%7;
const scheduled=(h,d)=>d>=h.since&&(!h.until||d<h.until)&&h.days.includes(wdx(d));
const sched=d=>S.habits.filter(h=>scheduled(h,d));
function ensure(d){return S.log[d]||(S.log[d]={done:{},vals:{},slip:{},note:'',rest:false,total:sched(d).length})}
function ic(){IC={};TL=null}
/* Cierra los días pasados: fija cuántos hábitos tocaban cada día para que cambiar horarios no reescriba el historial */
function closeDays(keep){
  const y=addDays(today(),-1);
  for(let d=S.closed?addDays(S.closed,1):S.start;d<=y;d=addDays(d,1)){
    const r=ensure(d);if(!keep)r.total=sched(d).length;
  }
  if(!S.closed||S.closed<y)S.closed=y;
  /* Cada día pasado conserva el porcentaje exigido con el que se cerró */
  const t=today();
  Object.keys(S.log).forEach(d=>{if(d<t&&S.log[d].thr===undefined)S.log[d].thr=S.threshold});
}

/* ============ Cálculo de un día ============ */
function info(date){
  if(IC[date])return IC[date];
  const r=S.log[date],live=date===today();
  const act=new Set(S.habits.filter(h=>!h.until).map(h=>h.id));
  const done=r?r.done:{},slip=r?r.slip:{};
  let dk=Object.keys(done),sk=Object.keys(slip);
  if(live){dk=dk.filter(k=>act.has(k));sk=sk.filter(k=>act.has(k))}
  const total=(live||!r)?sched(date).length:r.total;
  const n=dk.length,base=dk.reduce((a,k)=>a+done[k],0),pen=sk.reduce((a,k)=>a+slip[k],0);
  const ratio=total?Math.min(1,n/total):(n>0?1:0);
  const thr=(live||!r||r.thr===undefined)?S.threshold:r.thr;
  const ok=n>0&&ratio>=thr;
  const rest=!!(r&&r.rest);
  const raw=ok?'ok':rest?'rest':(total===0&&n===0)?'free':'miss';
  return IC[date]={done,keys:dk,slips:sk,n,base,pen,total,ratio,thr,ok,rest,raw,xp:base+(ok?BONUS:0)-pen};
}
/* Estado de cada día: ok, miss, rest (descanso), free (sin hábitos), shield (cubierto por escudo), open (hoy pendiente) */
function timeline(){
  if(TL)return TL;
  const t=today(),map={};let run=0,best=0,days=0,shields=0,used=0;
  for(let d=S.start;d<=t;d=addDays(d,1)){
    let st=info(d).raw;
    if(st==='ok'){run++;best=Math.max(best,run);days++;if(days%7===0&&shields<2)shields++}
    else if(st==='miss'){
      if(d===t)st='open';
      else if(shields>0){shields--;used++;st='shield'}
      else run=0;
    }
    map[d]=st;
  }
  return TL={map,cur:run,best,days,shields,used};
}

function weekStats(ws){
  const t=today(),w={ok:0,good:0,xp:0,run:0,notes:0,cat:{},clean:0};let run=0;
  const meta={};S.habits.forEach(h=>meta[h.id]=h);
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    if(d>t||d<S.start){run=0;continue}
    const inf=info(d),r=S.log[d],st=status(d);
    w.xp+=inf.xp;
    if(st==='ok'){w.ok++;w.good++;run++;w.run=Math.max(w.run,run)}
    else if(st==='free')w.good++;
    else if(st==='miss')run=0;
    if(r&&r.note&&r.note.trim())w.notes++;
    const seen={};let av=0;
    inf.keys.forEach(k=>{const h=meta[k];if(h){seen[h.cat]=1;if(h.type==='avoid')av++}});
    Object.keys(seen).forEach(c=>w.cat[c]=(w.cat[c]||0)+1);
    if(av>0&&inf.slips.length===0)w.clean++;
  }
  return w;
}

function stats(){
  const tl=timeline(),t=today(),types={};S.habits.forEach(h=>types[h.id]=h.type);
  let perfectDay=false,notes=0,counts=0,avoids=0,comeback=false,perfectWeek=false,p1='',p2='';
  for(let d=S.start;d<=t;d=addDays(d,1)){
    const i=info(d),r=S.log[d],st=tl.map[d];
    if(st==='ok'){
      if(p1==='miss'&&p2==='miss')comeback=true;
      if(i.ratio===1&&i.total>=3)perfectDay=true;
    }
    p2=p1;p1=st;
    if(r&&r.note&&r.note.trim())notes++;
    i.keys.forEach(k=>{if(types[k]==='count')counts++;if(types[k]==='avoid')avoids++});
  }
  for(let ws=weekStart(S.start);ws<=t;ws=addDays(ws,7)){
    let good=true,oks=0;
    for(let i=0;i<7;i++){
      const d=addDays(ws,i);
      if(d<S.start||d>t){good=false;break}
      const st=tl.map[d];
      if(st==='ok')oks++;else if(st!=='free'){good=false;break}
    }
    if(good&&oks>=3)perfectWeek=true;
  }
  const xp=totalXP();
  return{days:tl.days,best:tl.best,perfectDay,perfectWeek,notes,counts,avoids,comeback,shieldsUsed:tl.used,missions:Object.keys(S.claimed).length,level:levelOf(xp),xp};
}
function checkProgress(silent){
  const msgs=[],t=today(),ws=weekStart(t);ic();

    if(!S.claimed[k]&&m.val(w)>=m.goal){S.claimed[k]=m.xp;msgs.push('Misión cumplida: '+m.t+' (+'+m.xp+' XP)')}

  ic();const s=stats();
  ACH.forEach(a=>{if(!S.unlocked[a[0]]&&a[3](s)){S.unlocked[a[0]]=t;msgs.push('Logro desbloqueado: '+a[1])}});

}

function phrase(){
  const t=today(),y=addDays(t,-1),n=Math.floor(parse(t).getTime()/864e5);let pool;
  if(info(t).ok)pool=F.hecho;
  else if(y>=S.start&&status(y)==='miss')pool=F.caida;

  else pool=F.inicio;

/* ============ Estadísticas por periodo ============ */
function periodStats(a,b){
  const t=today(),t0=info(t),endT=(t0.n>0||t0.ok||t0.rest)?t:addDays(t,-1);
  const from=a<S.start?S.start:a,to=b>endT?endT:b;
  const P={n:0,ok:0,xp:0,avgSum:0,best:0,slips:0,neutral:0,notes:[],wd:[0,1,2,3,4,5,6].map(()=>[0,0]),hab:{},avg:0};
  S.habits.forEach(h=>P.hab[h.id]={h,d:0,s:0});
  if(from>to)return P;
  let run=0;
  for(let d=from;d<=to;d=addDays(d,1)){
    const i=info(d),r=S.log[d],st=status(d);
    P.xp+=i.xp;P.slips+=i.slips.length;
    if(r&&r.note&&r.note.trim())P.notes.push([d,r.note.trim()]);
    if(st==='rest'||st==='free'){P.neutral++;continue}
    P.n++;P.avgSum+=i.ratio;
    if(st==='ok'){P.ok++;run++;P.best=Math.max(P.best,run)}else if(st==='miss')run=0;
    const w=wdx(d);P.wd[w][0]+=i.ratio;P.wd[w][1]++;
    S.habits.forEach(h=>{
      const e=i.done[h.id]!==undefined;
      if(scheduled(h,d)||e){P.hab[h.id].s++;if(e)P.hab[h.id].d++}
    });
  }
  P.avg=P.n?P.avgSum/P.n:0;
  return P;
}
function wdSummary(P){
  const a=P.wd.map((x,i)=>({i,n:x[1],p:x[1]?x[0]/x[1]:0})).filter(x=>x.n>0);
  if(a.length<2)return null;
  const best=a.reduce((m,x)=>x.p>m.p?x:m),worst=a.reduce((m,x)=>x.p<m.p?x:m);
  return best.p===worst.p?null:{best,worst};
}

function mutate(fn,fk){

function toggle(id){

  mutate(r=>{if(r.done[id]!==undefined)delete r.done[id];else{r.done[id]=h.xp;delete r.slip[id]}},'t'+id);

function bump(id,dir){
  const h=habit(id);if(!h)return;
  mutate(r=>{
    const v=Math.max(0,Math.round(((r.vals[id]||0)+dir*h.step)*100)/100);
    r.vals[id]=v;
    if(v>=h.target)r.done[id]=h.xp;else delete r.done[id];
  },'c'+id+(dir>0?'p':'m'));

function offerUndo(msg,snap){

}
function doUndo(){
  if(!UNDO)return;
  const snap=UNDO.snap;hideUndo();
  S=migrate(JSON.parse(snap));editId=null;delArm=null;armed=false;
  closeDays(!S.closed);if(sel>today())sel=today();

function avoid(id,kind){
  const h=habit(id);if(!h)return;
  const snap=JSON.stringify(S),v0=SV,r0=S.log[sel],wasSlip=!!(r0&&r0.slip[id]!==undefined);
  mutate(r=>{
    if(kind==='ok'){if(r.done[id]!==undefined)delete r.done[id];else{r.done[id]=h.xp;delete r.slip[id]}}
    else{if(r.slip[id]!==undefined)delete r.slip[id];else{r.slip[id]=h.xp;delete r.done[id]}}
  },'a'+kind+id);

function toggleRest(){
  if(sel>today())return;

  const ws=weekStart(sel);let c=0;
  for(let i=0;i<7;i++){const d=addDays(ws,i);if(d!==sel&&S.log[d]&&S.log[d].rest)c++}

  mutate(r=>{r.rest=true},'rest');

}

  const a=S.habits.indexOf(act[i]),b=S.habits.indexOf(act[j]);

function render(){

  const head=`<header class="top"><div class="rank"><span class="lvl">Nivel ${lv}</span><h1>${rankOf(lv)}</h1></div><div class="xp"><div class="bar" role="progressbar" aria-label="Progreso al siguiente nivel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><p>${xp} XP · faltan ${hi-xp} para el nivel ${lv+1}</p></div></header>`;
  const views={hoy:viewHoy,prog:viewProg,logros:viewLogros,res:viewRes,ajustes:viewSet};
  const tabs=[['hoy','Hoy'],['prog','Progreso'],['logros','Logros'],['res','Resumen'],['ajustes','Ajustes']];
  const nav='<nav class="tabs" aria-label="Secciones">'+tabs.map(x=>`<button data-tab="${x[0]}"${tab===x[0]?' aria-current="page"':''}>${x[1]}</button>`).join('')+'</nav>';

function exportData(){
  const j=JSON.stringify(S),ta=document.getElementById('bk');ta.value=j;
  try{const b=new Blob([j],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='muro-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  toast('Copia lista. Si no se descargó, usa «Copiar texto».');
}
function copyData(){
  const ta=document.getElementById('bk');if(!ta.value)ta.value=JSON.stringify(S);
  ta.select();
  try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado'),()=>{document.execCommand('copy');toast('Copiado')})}catch(e){try{document.execCommand('copy');toast('Copiado')}catch(_){toast('Selecciona el texto y cópialo')}}
}
function importText(txt){
  try{
    const o=JSON.parse(txt);
    if(!o||!Array.isArray(o.habits)||typeof o.log!=='object')throw 0;
    const snap=JSON.stringify(S);
    S=migrate(o);closeDays(!S.closed);sel=today();editId=null;checkProgress(true);save();applyTheme();render();offerUndo('Copia restaurada',snap);
  }catch(e){toast('Ese texto no es una copia válida')}
}
function applyTheme(){
  const el=document.documentElement;
  if(S.theme==='light'||S.theme==='dark')el.setAttribute('data-theme',S.theme);else el.removeAttribute('data-theme');
}

/* ============ Eventos ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if('undo' in d)return doUndo();
  if(d.tab){tab=d.tab;goTop();return render()}
  if(d.toggle)return toggle(d.toggle);
  if(d.cnt)return bump(d.cnt,Number(d.d));
  if(d.av)return avoid(d.av,d.avk);
  if(d.shift){const n=addDays(sel,Number(d.shift));if(n<=today()&&n>=S.start){sel=n;render()}return}
  if(d.sel){sel=d.sel;tab='hoy';goTop();return render()}
  if(d.mode){sumMode=d.mode;sumOff=0;return render()}
  if(d.off){sumOff=Math.max(0,sumOff+Number(d.off));return render()}
  if(d.hdel){
    if(delArm===d.hdel){const snap=JSON.stringify(S),hh=habit(d.hdel);S.habits=S.habits.filter(h=>h.id!==d.hdel);delArm=null;ic();save();render();return offerUndo('Hábito eliminado'+(hh?': '+hh.name:''),snap)}
    delArm=d.hdel;clearTimeout(delTimer);delTimer=setTimeout(()=>{delArm=null;if(tab==='ajustes')render()},3000);return render();
  }
  if('rest' in d)return toggleRest();
  if(d.up)return moveHabit(d.up,-1);
  if(d.down)return moveHabit(d.down,1);
  if(d.edit){editId=d.edit;return render()}
  if('cancel' in d){editId=null;return render()}
  if(d.arch)return archiveHabit(d.arch);
  if(d.restore)return restoreHabit(d.restore);
  if('export' in d)return exportData();
  if('copy' in d)return copyData();
  if('import' in d){const v=document.getElementById('bk').value.trim();return v?importText(v):toast('Pega primero el texto de la copia')}
  if('reset' in d){
    if(!armed){armed=true;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=false;if(tab==='ajustes')render()},4000);return render()}
    const snap=JSON.stringify(S);S=fresh();closeDays(false);sel=today();armed=false;editId=null;tab='hoy';save();applyTheme();render();offerUndo('Muro reiniciado. A empezar de cero.',snap);
  }
});
document.addEventListener('submit',e=>{
  const ef=e.target.closest('[data-edit-form]');
  if(ef){
    e.preventDefault();
    const h=habit(ef.dataset.editForm);if(!h)return;
    const d=new FormData(ef),name=String(d.get('name')||'').trim(),days=readDays(d);
    if(!name)return;
    if(!days.length){toast('Elige al menos un día');return}
    let tg=h.target,st=h.step;
    if(h.type==='count'){tg=Number(d.get('target'));st=Number(d.get('step'));if(!(tg>0)||!(st>0)){toast('La meta y el paso deben ser mayores que 0');return}}
    h.name=name;h.cat=d.get('cat');h.xp=Number(d.get('xp'));h.days=days;
    if(h.type==='count'){h.target=tg;h.step=st;h.unit=String(d.get('unit')||'').trim()}
    const r=S.log[today()];
    if(r){
      if(h.type==='count'){const v=r.vals[h.id]||0;if(v>=h.target)r.done[h.id]=h.xp;else delete r.done[h.id]}
      else if(r.done[h.id]!==undefined)r.done[h.id]=h.xp;
      else if(r.slip[h.id]!==undefined)r.slip[h.id]=h.xp;
    }
    editId=null;const m=checkProgress();save();render();toast('Hábito actualizado');m.forEach(toast);return;
  }
  const f=e.target.closest('[data-add]');if(!f)return;e.preventDefault();
  const d=new FormData(f),name=String(d.get('name')||'').trim();if(!name)return;
  const days=readDays(d);
  if(!days.length){toast('Elige al menos un día');return}
  const type=d.get('type'),h={id:uid(),name,cat:d.get('cat'),xp:Number(d.get('xp')),type,target:1,unit:'',step:1,days,since:today(),until:null};
  if(type==='count'){
    const tg=Number(d.get('target')),st=Number(d.get('step'));
    if(!(tg>0)||!(st>0)){toast('La meta y el paso deben ser mayores que 0');return}
    h.target=tg;h.step=st;h.unit=String(d.get('unit')||'').trim();
  }
  S.habits.push(h);ic();save();render();toast('Hábito añadido');
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='thr'){S.threshold=Number(el.value);const m=checkProgress();save();render();toast('Cambio aplicado desde hoy. El pasado no se modifica.');m.forEach(toast)}
  else if(el.id==='maxrest'){S.maxRest=Number(el.value);save()}
  else if(el.id==='theme'){S.theme=el.value;save();applyTheme()}
  else if(el.id==='file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f)}
  else if(el.name==='type'){const cf=document.querySelector('[data-cf]');if(cf)cf.hidden=el.value!=='count'}
  else if(el.id==='note'){const m=checkProgress();save();m.forEach(toast)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='note'){if(sel>today())return;const r=ensure(sel);r.note=e.target.value.slice(0,300);if(sel===today())r.total=sched(sel).length;if(sel<S.start)S.start=sel;save()}
});
let lastDay=today();
function rollover(){
  const t=today();
  if(t!==lastDay){if(sel===lastDay)sel=t;lastDay=t}
  closeDays(false);save();
  if(sel>t)sel=t;
  render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});
setInterval(()=>{if(today()!==lastDay)rollover()},60000);

/* ============ Arranque ============ */
applyTheme();
closeDays(!S.closed);
if(oldVer!==3){checkProgress(true)}
save();
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
